<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>RentEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.classList.add('js');
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem('rentease-theme');
          if (t !== 'light' && t !== 'dark') {
            var d = 'system';
            try { d = JSON.parse(localStorage.getItem('rentease-settings') || '{}').default_theme || 'system'; } catch (e) {}
            t = d === 'light' || d === 'dark' ? d
              : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
